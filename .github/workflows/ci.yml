name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep production runs in order; a new push must not interrupt publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_EXK_PASSWD_CHROMIUM_STORE_URL: ${{ vars.VITE_EXK_PASSWD_CHROMIUM_STORE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm quality

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Install headless Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run component tests
        run: pnpm test:components

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/unit/lcov.info,coverage/components/lcov.info
          flags: unit,components
          fail_ci_if_error: false
          cleanup: true

      - name: Run Storybook interaction and accessibility tests
        run: pnpm test:storybook

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Test the static Storybook artifact
        run: pnpm test:storybook:e2e
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

      - name: Validate Storybook deployment package
        run: pnpm exec wrangler deploy --config wrangler.storybook.toml --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Validate domain redirect deployment package
        run: pnpm exec wrangler deploy --config wrangler.redirects.jsonc --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Package tested showcase and Storybook artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf deployment-showcase.tar.gz build storybook-static .svelte-kit/tsconfig.json

      - name: Upload tested showcase and Storybook artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-showcase
          path: deployment-showcase.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  landing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check landing types
        run: pnpm check:landing
      - name: Install headless Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run landing tests
        run: pnpm test:landing
      - name: Validate landing deployment package
        run: pnpm --filter landing exec wrangler deploy --env="" --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

      # The adapter entry imports its generated server and manifest outside cloudflare/.
      - name: Package tested landing artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf deployment-landing.tar.gz apps/landing/.svelte-kit

      - name: Upload tested landing artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-landing
          path: deployment-landing.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  exk-passwd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check browser generator types
        run: pnpm check:exk-passwd
      - name: Run browser-core and packaging tests
        run: pnpm --filter exk-passwd-browser test:unit
      - name: Check Chrome Web Store publish readiness
        run: pnpm --filter exk-passwd-browser stores:verify
        env:
          VITE_EXK_PASSWD_CHROMIUM_STORE_URL: ${{ vars.VITE_EXK_PASSWD_CHROMIUM_STORE_URL }}
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run browser generator end-to-end tests
        run: pnpm --filter exk-passwd-browser test:e2e

  waitlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check waitlist types
        run: pnpm check:waitlist

      - name: Run waitlist unit tests
        run: pnpm --filter waitlist test:unit

      - name: Install headless Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run waitlist Workers runtime tests
        run: pnpm --filter waitlist test:workers

      - name: Run waitlist end-to-end tests
        run: pnpm --filter waitlist test:e2e

      - name: Validate waitlist deployment packages
        run: |
          pnpm --filter waitlist exec wrangler deploy --env="" --dry-run
          pnpm --filter waitlist exec wrangler deploy --config wrangler.admin.toml --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Package tested waitlist artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf deployment-waitlist.tar.gz apps/waitlist/.svelte-kit

      - name: Upload tested waitlist artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-waitlist
          path: deployment-waitlist.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, exk-passwd, waitlist, landing]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Actions secrets.'
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download tested deployment artifacts from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deployment-*
          merge-multiple: true

      - name: Restore tested deployment artifacts
        run: |
          tar -xzf deployment-showcase.tar.gz
          tar -xzf deployment-landing.tar.gz
          tar -xzf deployment-waitlist.tar.gz

      - name: Publish production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          pnpm --filter waitlist exec wrangler d1 migrations apply waitlist --config wrangler.toml --env="" --remote
          pnpm --filter waitlist exec wrangler deploy --config wrangler.admin.toml --env=""
          pnpm --filter waitlist exec wrangler deploy --config wrangler.toml --env=""
          pnpm --filter landing exec wrangler deploy --config wrangler.toml --env=""
          pnpm exec wrangler deploy --config wrangler.redirects.jsonc
          pnpm exec wrangler deploy --config wrangler.storybook.toml
          pnpm exec wrangler pages deploy build --project-name futhr --branch main --commit-hash "$DEPLOY_COMMIT" --commit-dirty=false
