name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm quality

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Install headless Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run component tests
        run: pnpm test:components

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/unit/lcov.info,coverage/components/lcov.info
          flags: unit,components
          fail_ci_if_error: false

      - name: Run Storybook interaction and accessibility tests
        run: pnpm test:storybook

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Test the static Storybook artifact
        run: pnpm test:storybook:e2e
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

      - name: Validate Storybook deployment package
        run: pnpm exec wrangler deploy --config wrangler.storybook.toml --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Validate domain redirect deployment package
        run: pnpm exec wrangler deploy --config wrangler.redirects.jsonc --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check landing types
        run: pnpm check:landing
      - name: Install headless Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run landing tests
        run: pnpm test:landing
      - name: Validate landing deployment package
        run: pnpm --filter landing exec wrangler deploy --env="" --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

  exk-passwd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check browser generator types
        run: pnpm check:exk-passwd
      - name: Run browser-core and packaging tests
        run: pnpm --filter exk-passwd-browser test:unit
      - name: Check Chrome Web Store publish readiness
        run: pnpm --filter exk-passwd-browser stores:verify
        env:
          VITE_EXK_PASSWD_CHROMIUM_STORE_URL: ${{ vars.VITE_EXK_PASSWD_CHROMIUM_STORE_URL }}
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run browser generator end-to-end tests
        run: pnpm --filter exk-passwd-browser test:e2e

  waitlist:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check waitlist types
        run: pnpm check:waitlist

      - name: Run waitlist unit tests
        run: pnpm --filter waitlist test:unit

      - name: Install headless Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run waitlist Workers runtime tests
        run: pnpm --filter waitlist test:workers

      - name: Run waitlist end-to-end tests
        run: pnpm --filter waitlist test:e2e

      - name: Validate waitlist deployment packages
        run: |
          pnpm --filter waitlist exec wrangler deploy --env="" --dry-run
          pnpm --filter waitlist exec wrangler deploy --config wrangler.admin.toml --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
