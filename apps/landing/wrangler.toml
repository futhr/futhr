# Production entry guards the host before the framework can serve any asset.
name = "project-landings"
main = "src/worker.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_als"]
workers_dev = false
preview_urls = false

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[observability]
enabled = true
head_sampling_rate = 0.01
[observability.logs]
invocation_logs = false
[observability.traces]
enabled = true
head_sampling_rate = 0.01

[[routes]]
pattern = "wotex.io"
custom_domain = true
[[routes]]
pattern = "www.wotex.io"
custom_domain = true
[[routes]]
pattern = "reloved.eco"
custom_domain = true
[[routes]]
pattern = "www.reloved.eco"
custom_domain = true
[[routes]]
pattern = "recetas.co.com"
custom_domain = true
[[routes]]
pattern = "www.recetas.co.com"
custom_domain = true

[env.local]
routes = []
[env.local.vars]
LANDING_LOCAL = "true"
[env.local.assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"
