# Private list API on lists.futhr.io. The hostname sits behind Cloudflare Access
# and the Worker validates the Access JWT itself; see src/lib/server/admin/access.ts.
name = "waitlist-admin"
main = "src/admin-worker.ts"
tsconfig = "tsconfig.worker.json"
compatibility_date = "2026-09-03"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 0.01
redact_query_string = true
[observability.logs]
invocation_logs = false
[observability.traces]
enabled = true
head_sampling_rate = 0.01

[vars]
WAITLIST_ENVIRONMENT = "production"

# The same EU-jurisdiction database as wrangler.toml.
[[d1_databases]]
binding = "DB"
database_name = "waitlist"
database_id = "5460764d-8c17-4c96-91df-2031567d51fb"
migrations_dir = "migrations"

[[routes]]
pattern = "lists.futhr.io"
custom_domain = true
